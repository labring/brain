name: Docker Images

on:
  pull_request:
    paths:
      - ".github/workflows/docker-images.yml"
      - ".dockerignore"
      - "apps/ui/Dockerfile"
      - "apps/ui/package.json"
      - "apps/ui/next.config.mjs"
      - "apps/registry/Dockerfile"
      - "apps/registry/package.json"
      - "apps/registry/next.config.mjs"
      - "package.json"
      - "bun.lock"
  push:
    branches:
      - main
      - zjy365
    tags:
      - "api-*"
      - "ui-*"
      - "v*"
  workflow_dispatch:
    inputs:
      next_public_dev_tweaks:
        description: "Set to 1 to bake the dev tweaks panel into the UI image (demo builds)"
        required: false
        type: string
      next_public_demo_mock:
        description: "Set to 1 so the UI opens with mock project data on (demo builds; pair with next_public_dev_tweaks=1)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: brain-api
            context: .
            dockerfile: apps/api/Dockerfile
          - component: ui
            image: brain-ui
            context: .
            dockerfile: apps/ui/Dockerfile
          - component: registry
            image: brain-registry
            context: .
            dockerfile: apps/registry/Dockerfile
          - component: whodb
            image: brain-whodb
            context: apps/whodb
            dockerfile: apps/whodb/core/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_DEV_TWEAKS=${{ inputs.next_public_dev_tweaks }}
            NEXT_PUBLIC_DEMO_MOCK=${{ inputs.next_public_demo_mock }}
            VERSION=${{ steps.meta.outputs.version }}
            PLATFORM=github-actions
