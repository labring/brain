name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: check / typecheck / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (bun check)
        run: bun check

      - name: TypeScript (bun typecheck)
        run: bun typecheck

      - name: ESLint (bun lint)
        run: bun lint
