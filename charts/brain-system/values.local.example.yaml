# Copy this file once to a persistent private path and fill private credentials.
# Do not overwrite that file during upgrades because it contains stable keys.
# See charts/brain-system/README.md for the guarded creation command.
#
# The install script reads cloudDomain/cloudPort from
# sealos-system/sealos-config and passes them to Helm. Do not set global
# cloud values here unless you intentionally want to override platform config.
# DATABASE_URL, DB_PUBLIC_HOST, API_URL, NEXT_PUBLIC_APP_URL, and
# DEVBOX_API_BASE_URL are generated by chart helpers when left empty.

apPublicAccess:
  # New APs use the first entry. The wildcard Secret must exist in each user namespace.
  userDomains:
    - name: gzg.sealos.run
      secretName: wildcard-cert
    - name: sealosgzg.site
      secretName: wildcard-cert

api:
  env:
    VMSELECT_URL: "http://vmselect-vm-stack-victoria-metrics-k8s-stack.vm.svc:8481/select/0/prometheus"
    VLSELECT_URL: "http://usr-vlc-victoria-logs-cluster-vlselect.vlc.svc:9471/select/logsql/query"
    # Process-level credentials; changing them requires an API rollout.
    VLSELECT_USERNAME: ""
    VLSELECT_PASSWORD: ""
    # Leave empty to use the chart-created brain-pg KubeBlocks credential.
    DATABASE_URL: ""
    # Leave empty to use global.cloudDomain from sealos-config.
    DB_PUBLIC_HOST: ""
    # Leave empty to use the chart-created WhoDB Service in the release namespace.
    WHODB_URL: ""

ui:
  env:
    # Leave empty to use the API Ingress generated by this chart.
    API_URL: ""
    # Leave empty to use the UI Ingress generated by this chart.
    NEXT_PUBLIC_APP_URL: ""
    # Optional Google Tag Manager container id, for example GTM-XXXXXXX.
    GTM_ID: ""
    # Leave empty to use the chart-created brain-pg KubeBlocks credential.
    DATABASE_URL: ""
    # Required (ADR-0059): the region's cluster-shared app-token secret
    # (sealos-system desktop-frontend config). Production boots fail fast
    # when it is unset.
    JWT_INTERNAL: "REPLACE_ME_CLUSTER_JWT_INTERNAL"
    # Shared bearer secret for trusted lifecycle, health, and billing producers.
    MARKETING_EVENTS_INGEST_SECRET: "REPLACE_ME_MARKETING_EVENTS_INGEST_SECRET"
    GITHUB_APP_ID: "REPLACE_ME"
    GITHUB_APP_PRIVATE_KEY: "REPLACE_ME_PRIVATE_KEY"
    GITHUB_OAUTH_CLIENT_ID: "REPLACE_ME_OAUTH_CLIENT_ID"
    GITHUB_OAUTH_CLIENT_SECRET: "REPLACE_ME_OAUTH_CLIENT_SECRET"
    # Keep stable; changing this prevents decrypting previously stored GitHub user tokens.
    GITHUB_USER_TOKEN_ENCRYPTION_KEY: "REPLACE_ME_STABLE_TOKEN_ENCRYPTION_KEY"
    # Platform-paid free turns. Set FREE_CHAT_TURNS to "0" to disable.
    SYSTEM_OPENAI_API_KEY: "REPLACE_ME_OPENAI_COMPATIBLE_KEY"
    SYSTEM_OPENAI_API_BASE_URL: "https://api.openai.com/v1"
    FREE_CHAT_TURNS: "5"
    # User-billed turns use the Sealos AI proxy.
    AI_PROXY_TOKEN_NAME: "sealos-brain"
    # Leave empty to use https://devbox-server.<cloudDomain>.
    DEVBOX_API_BASE_URL: ""
    DEVBOX_TOKEN: ""
    DEVBOX_JWT_SIGNING_KEY: "REPLACE_ME_DEVBOX_JWT_SIGNING_KEY"
    DEVBOX_RUNTIME_IMAGE: ""
    DEVBOX_JWT_TTL_SECONDS: "14400"
    # Storage ceiling for newly created deployment runtimes; existing Devboxes are unchanged.
    DEPLOY_DEVBOX_STORAGE_LIMIT: "10Gi"
    # Optional. Leave empty for brain-deploy. Staging may use:
    # https://github.com/labring/sealos-skills/tree/brain-deploy-preview
    DEPLOY_SKILL_SOURCE: ""

imagePullSecret:
  # App workload pods reference ghcr-cred when this chart creates it.
  # Set useForWhodb to true if the configured brain-whodb image requires auth.
  create: true
  useForWhodb: false
  name: ghcr-cred
  dockerConfigJson: '{"auths":{}}'
