# Copy this file to a private path and fill only private credentials, for example:
#   cp charts/brain-system/values.local.example.yaml /tmp/brain-system.values.yaml
#   charts/brain-system/install.sh /tmp/brain-system.values.yaml
#
# The install script reads cloudDomain/cloudPort from
# sealos-system/sealos-config and passes them to Helm. Do not set global
# cloud values here unless you intentionally want to override platform config.
# DATABASE_URL, DB_PUBLIC_HOST, API_URL, NEXT_PUBLIC_APP_URL, and
# DEVBOX_API_BASE_URL are generated by chart helpers when left empty.

api:
  env:
    VMSELECT_URL: "http://vmselect-vm-stack-victoria-metrics-k8s-stack.vm.svc:8481/select/0/prometheus"
    VLSELECT_URL: "http://usr-vlc-victoria-logs-cluster-vlselect.vlc.svc:9471"
    VLSELECT_USERNAME: ""
    VLSELECT_PASSWORD: ""
    VMAUTH_SECRET_NAMESPACE: ""
    VMAUTH_SECRET_NAME: ""
    # Leave empty to use the chart-created brain-pg KubeBlocks credential.
    DATABASE_URL: ""
    # Leave empty to use global.cloudDomain from sealos-config.
    DB_PUBLIC_HOST: ""
    WHODB_URL: "http://whodb.brain-system.svc:11000"

ui:
  env:
    # Leave empty to use the API Ingress generated by this chart.
    API_URL: ""
    # Leave empty to use the UI Ingress generated by this chart.
    NEXT_PUBLIC_APP_URL: ""
    # Leave empty to use the chart-created brain-pg KubeBlocks credential.
    DATABASE_URL: ""
    GITHUB_APP_ID: "REPLACE_ME"
    GITHUB_APP_PRIVATE_KEY: "REPLACE_ME_PRIVATE_KEY"
    # Platform-paid free turns. Set FREE_CHAT_TURNS to "0" to disable.
    SYSTEM_OPENAI_API_KEY: "REPLACE_ME_OPENAI_COMPATIBLE_KEY"
    SYSTEM_OPENAI_API_BASE_URL: "https://api.openai.com/v1"
    FREE_CHAT_TURNS: "5"
    # User-billed turns use the Sealos AI proxy.
    AI_PROXY_TOKEN_NAME: "sealos-brain"
    # Leave empty to use https://devbox-server.<cloudDomain>.
    DEVBOX_API_BASE_URL: ""
    DEVBOX_TOKEN: ""
    DEVBOX_JWT_SIGNING_KEY: "REPLACE_ME_DEVBOX_JWT_SIGNING_KEY"
    DEVBOX_RUNTIME_IMAGE: ""
    DEVBOX_ARCHIVE_AFTER_PAUSE_TIME: "24h"
    DEVBOX_JWT_TTL_SECONDS: "14400"

imagePullSecret:
  # App workload pods reference ghcr-cred when this chart creates it.
  create: true
  useForWhodb: false
  name: ghcr-cred
  dockerConfigJson: '{"auths":{}}'
