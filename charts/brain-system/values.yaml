global:
  # Deployment scripts auto-fill cloudDomain/cloudPort from
  # sealos-system/sealos-config. region is kept as a deprecated alias for
  # existing private values files.
  cloudDomain: 127.0.0.1.nip.io
  cloudPort: ""
  region: ""
  labels: {}
  annotations: {}

apPublicAccess:
  # Brain-created APs use the first entry. Additional entries are reserved for
  # future user-selectable domain support.
  userDomains: []

imagePullSecret:
  create: false
  useForWhodb: false
  name: ghcr-cred
  dockerConfigJson: '{"auths":{}}'

database:
  enabled: true
  name: brain-pg
  engine: postgresql
  quota: xs
  replicas: 1
  exposeNodePort: true
  terminationPolicy: Delete
  storageSize: ""
  storageClassName: ""
  cpuRequest: ""
  memoryRequest: ""
  cpuLimit: ""
  memoryLimit: ""
  scheduledBackup:
    enabled: true
    cronExpression: "13 10 * * *"
    retentionPeriod: 14d
    repoName: backuprepo-s3

api:
  enabled: true
  name: brain-api-staging
  image: ghcr.io/labring/brain-api:latest
  imagePullPolicy: Always
  port: 9000
  paused: false
  platformAddresses:
    - id: pa_stagingapi1
      port: 9000
    - id: pa_stagingapi2
      port: 9000
  env:
    AP_USER_DOMAIN: ""
    AP_USER_DOMAIN_TLS_SECRET_NAME: ""
    VMSELECT_URL: "http://vmselect-vm-stack-victoria-metrics-k8s-stack.vm.svc:8481/select/0/prometheus"
    VLSELECT_URL: "http://usr-vlc-victoria-logs-cluster-vlselect.vlc.svc:9471/select/logsql/query"
    VLSELECT_USERNAME: ""
    VLSELECT_PASSWORD: ""
    VMAUTH_SECRET_NAMESPACE: ""
    VMAUTH_SECRET_NAME: ""
    DATABASE_URL: ""
    DB_PUBLIC_HOST: ""
    WHODB_URL: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
    replicas: 1
  probes:
    startup:
      httpGet:
        path: /health
        port: 9000
      failureThreshold: 30
      periodSeconds: 5
    readiness:
      httpGet:
        path: /health
        port: 9000
      failureThreshold: 3
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 9000
      failureThreshold: 3
      initialDelaySeconds: 15
      periodSeconds: 10

ui:
  enabled: true
  name: brain-ui-staging
  image: ghcr.io/labring/brain-ui:latest
  imagePullPolicy: Always
  # Forward-only identity migrations must never overlap old and new API routes.
  strategy: Recreate
  port: 3000
  paused: false
  platformAddresses:
    - id: pa_uistaging1
      port: 3000
      domainPrefix: brain
    - id: pa_uistaging2
      port: 3000
  env:
    AP_USER_DOMAIN: ""
    AP_USER_DOMAIN_TLS_SECRET_NAME: ""
    API_URL: ""
    NEXT_PUBLIC_APP_URL: ""
    DATABASE_URL: ""
    GITHUB_APP_ID: ""
    GITHUB_APP_PRIVATE_KEY: ""
    GITHUB_OAUTH_CLIENT_ID: ""
    GITHUB_OAUTH_CLIENT_SECRET: ""
    GITHUB_USER_TOKEN_ENCRYPTION_KEY: ""
    TEMPLATE_PROVIDER_URL: ""
    SYSTEM_OPENAI_API_KEY: ""
    SYSTEM_OPENAI_API_BASE_URL: "https://api.openai.com/v1"
    FREE_CHAT_TURNS: "5"
    AI_PROXY_TOKEN_NAME: "sealos-brain"
    DEVBOX_API_BASE_URL: ""
    DEVBOX_TOKEN: ""
    DEVBOX_JWT_SIGNING_KEY: ""
    DEVBOX_RUNTIME_IMAGE: ""
    DEVBOX_ARCHIVE_AFTER_PAUSE_TIME: "24h"
    DEVBOX_JWT_TTL_SECONDS: "14400"
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
    replicas: 1
  probes:
    startup:
      httpGet:
        path: /
        port: 3000
      failureThreshold: 30
      periodSeconds: 5
    readiness:
      httpGet:
        path: /
        port: 3000
      failureThreshold: 3
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      httpGet:
        path: /
        port: 3000
      failureThreshold: 3
      initialDelaySeconds: 15
      periodSeconds: 15

registry:
  enabled: true
  name: brain-registry
  image: ghcr.io/labring/brain-registry:latest
  imagePullPolicy: Always
  port: 10000
  paused: false
  platformAddresses:
    - id: pa_registry1
      port: 10000
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
    replicas: 1

whodb:
  enabled: true
  name: whodb
  image: ghcr.io/labring/brain-whodb:latest
  imagePullPolicy: Always
  port: 11000
  replicas: 1
  env:
    WHODB_LOG_LEVEL: warn
    WHODB_LOG_FORMAT: json
    WHODB_DISABLE_UPDATE_CHECK: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
